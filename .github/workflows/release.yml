# Runs when a maintainer pushes a version tag (vX.Y.Z). Agents never push tags.
# It builds the binaries with GoReleaser (checksums, SBOMs, provenance) into a draft release,
# signs checksums.txt in the environment "release" (a maintainer approves the job; the key is a
# secret of that environment only), checks the signature with the keys of install.sh, publishes
# the release, then the npm wrapper with the checksums and their signature, and makes the
# Homebrew formula for the tap.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries (GoReleaser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      id-token: write # provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt

  sign:
    name: Sign checksums.txt
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # upload the signature, then publish the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.CLI_RELEASE_SIGNING_KEY }}
        run: |
          set +x
          [ -n "$SIGNING_KEY" ] || { echo "The secret CLI_RELEASE_SIGNING_KEY of the environment release is missing."; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/cli-release-key"
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/cli-release-key" -n checkend-cli-release checksums.txt
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/cli-release-key"
      - name: Check the signature with the keys of install.sh
        run: |
          sed -n '/^# BEGIN ALLOWED SIGNERS$/,/^# END ALLOWED SIGNERS$/p' install.sh > "$RUNNER_TEMP/allowed_signers"
          awk '$1 != "" && $1 !~ /^#/ { print $1 }' "$RUNNER_TEMP/allowed_signers" > "$RUNNER_TEMP/principals"
          ok=
          while read -r principal; do
            if ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I "$principal" -n checkend-cli-release \
              -s checksums.txt.sig < checksums.txt; then ok=1; break; fi
          done < "$RUNNER_TEMP/principals"
          [ -n "$ok" ] || { echo "The signature does not verify with a key of install.sh: add the public key first."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: checksums.txt.sig
      - name: Upload the signature and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" checksums.txt.sig --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  npm:
    name: npm wrapper (@checkend/cli)
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: npm
      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cp ../LICENSE .
          npm version "${TAG#v}" --no-git-tag-version
          npm test
          npm publish --provenance --access public

  homebrew:
    name: Homebrew formula
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - name: Make the formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/homebrew-formula.sh "${TAG#v}" checksums.txt > checkend.rb
          ruby -c checkend.rb
      # A maintainer commits checkend.rb to the tap repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: checkend.rb
